services:
  - type: web
    name: movie-boxd
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --log-level warning
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: TMDB_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini-2025-08-07
      - key: NUM_RECOMMENDATIONS
        value: "5"
      - key: RECOMMENDATION_HISTORY_LIMIT
        value: "100"
      - key: FAVORITE_DIRECTOR_BOOST
        value: "0.08"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: AUTH_IDENTITY_SECRET
        sync: false
      - key: AUTH_COOKIE_SECURE
        value: "true"
