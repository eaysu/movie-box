services:
  - type: web
    name: movie-box
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --log-level warning
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: TMDB_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini-2025-08-07
      - key: NUM_RECOMMENDATIONS
        value: "8"
