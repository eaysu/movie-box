<style>
        .glow-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150vw;
            height: 150vw;
            background: radial-gradient(circle, rgba(0,224,84,0.05) 0%, rgba(16,20,23,0) 50%);
            pointer-events: none;
            z-index: -1;
            animation: pulseGlow 4s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.9); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }

        .spinner {
            width: 64px;
            height: 64px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00E054;
            border-right-color: #40BCF4;
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .step-item {
            opacity: 0.3;
            transform: translateY(10px);
            transition: all 0.5s ease;
        }

        .step-item.active {
            opacity: 1;
            transform: translateY(0);
            color: #e0e2e6; /* on-surface */
        }
        
        .step-item.completed {
            opacity: 0.7;
            transform: translateY(0);
        }

        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            background-size: 200% 100%;
            animation: shimmerEffect 2s infinite linear;
        }

        @keyframes shimmerEffect {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center relative overflow-hidden font-body-lg">
<div class="glow-bg"></div>
<main class="relative z-10 flex flex-col items-center max-w-md w-full px-margin-mobile">
<!-- Brand / Identity -->
<div class="mb-stack-lg flex flex-col items-center">
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">movie_filter</span>
<h1 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface tracking-tighter">LETTERBOXD <span class="text-primary-container">· AI</span></h1>
</div>
</div>
<!-- Spinner -->
<div class="mb-stack-lg relative">
<div class="spinner"></div>
<!-- Center glowing dot -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-2 h-2 bg-primary rounded-full shadow-[0_0_12px_#00E054] animate-pulse"></div>
</div>
<!-- Progress Steps -->
<div class="w-full bg-surface-container/50 border border-outline-variant/30 rounded-xl p-stack-md backdrop-blur-md">
<ul class="flex flex-col gap-stack-sm font-body-md text-body-md text-on-surface-variant" id="loading-steps">
<li class="step-item flex items-center gap-3 active">
<span class="material-symbols-outlined text-[16px]">search</span>
<span>Watchlist taranıyor...</span>
</li>
<li class="step-item flex items-center gap-3">
<span class="material-symbols-outlined text-[16px]">database</span>
<span>Filmler zenginleştiriliyor...</span>
</li>
<li class="step-item flex items-center gap-3">
<span class="material-symbols-outlined text-[16px]">psychology</span>
<span>Zevk analiz ediliyor...</span>
</li>
<li class="step-item flex items-center gap-3">
<span class="material-symbols-outlined text-[16px]">auto_awesome</span>
<span>Öneriler hazırlanıyor...</span>
</li>
</ul>
</div>
<!-- Bottom Info -->
<div class="mt-stack-lg text-center font-label-md text-label-md text-on-surface-variant/50 shimmer p-2 rounded">
            Sinema motoru çalışıyor
        </div>
</main>
<script>
        // Simple script to cycle through loading steps
        document.addEventListener('DOMContentLoaded', () => {
            const steps = document.querySelectorAll('.step-item');
            let currentStep = 0;

            const interval = setInterval(() => {
                if (currentStep < steps.length - 1) {
                    steps[currentStep].classList.remove('active');
                    steps[currentStep].classList.add('completed');
                    
                    // Add checkmark to completed step
                    const icon = steps[currentStep].querySelector('.material-symbols-outlined');
                    icon.textContent = 'check_circle';
                    icon.classList.add('text-primary');

                    currentStep++;
                    steps[currentStep].classList.add('active');
                } else {
                    clearInterval(interval);
                    // Final state before hypothetical redirect
                    steps[currentStep].classList.remove('active');
                    steps[currentStep].classList.add('completed');
                    const icon = steps[currentStep].querySelector('.material-symbols-outlined');
                    icon.textContent = 'check_circle';
                    icon.classList.add('text-primary');
                }
            }, 1500); // Wait 1.5s per step
        });
    </script>
